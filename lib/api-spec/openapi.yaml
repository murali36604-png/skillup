openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SkillUp LMS Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: courses
    description: Course management
  - name: enrollments
    description: Enrollment management
  - name: enquiries
    description: Course enquiries (public)
  - name: live-classes
    description: Live class sessions
  - name: dashboard
    description: Dashboard statistics
  - name: freelancer
    description: Freelancer marketplace
  - name: projects
    description: Project management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new freelancer or client account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error or email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses
      responses:
        "200":
          description: Courses list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a course (admin/trainer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePatch"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /enrollments:
    get:
      operationId: listEnrollments
      tags: [enrollments]
      summary: List enrollments
      responses:
        "200":
          description: Enrollments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"
    post:
      operationId: createEnrollment
      tags: [enrollments]
      summary: Enroll a student in a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /enrollments/{id}:
    delete:
      operationId: deleteEnrollment
      tags: [enrollments]
      summary: Remove enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /enquiries:
    get:
      operationId: listEnquiries
      tags: [enquiries]
      summary: List all enquiries (admin only)
      responses:
        "200":
          description: Enquiries list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
    post:
      operationId: submitEnquiry
      tags: [enquiries]
      summary: Submit a course enquiry (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResult"

  /live-classes:
    get:
      operationId: listLiveClasses
      tags: [live-classes]
      summary: List live class sessions
      responses:
        "200":
          description: Live classes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveClass"
    post:
      operationId: createLiveClass
      tags: [live-classes]
      summary: Create a live class session (admin/trainer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveClassInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveClass"

  /live-classes/{id}:
    delete:
      operationId: deleteLiveClass
      tags: [live-classes]
      summary: Delete live class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-enquiries:
    get:
      operationId: getRecentEnquiries
      tags: [dashboard]
      summary: Get recent enquiries
      responses:
        "200":
          description: Recent enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"

  /dashboard/my-enrollments:
    get:
      operationId: getMyEnrollments
      tags: [dashboard]
      summary: Get current student's enrollments with course details
      responses:
        "200":
          description: My enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentWithCourse"

  # ── Freelancer Marketplace ──────────────────────────────────────────────────

  /freelancer/profile:
    get:
      operationId: getFreelancerProfile
      tags: [freelancer]
      summary: Get my freelancer profile
      responses:
        "200":
          description: Freelancer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerProfile"
    put:
      operationId: upsertFreelancerProfile
      tags: [freelancer]
      summary: Create or update my freelancer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreelancerProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerProfile"

  /freelancer/bank-details:
    get:
      operationId: getBankDetails
      tags: [freelancer]
      summary: Get my bank details
      responses:
        "200":
          description: Bank details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankDetails"
    put:
      operationId: upsertBankDetails
      tags: [freelancer]
      summary: Create or update my bank details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankDetailsInput"
      responses:
        "200":
          description: Updated bank details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankDetails"

  /freelancer/my-bids:
    get:
      operationId: getMyBids
      tags: [freelancer]
      summary: Get my submitted bids (freelancer)
      responses:
        "200":
          description: My bids
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BidWithProject"

  /freelancers:
    get:
      operationId: listFreelancers
      tags: [freelancer]
      summary: Browse freelancers (public)
      responses:
        "200":
          description: Freelancers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FreelancerPublic"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all open projects (public)
      responses:
        "200":
          description: Projects list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Post a new project (client only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/my:
    get:
      operationId: getMyProjects
      tags: [projects]
      summary: Get my posted projects (client)
      responses:
        "200":
          description: My projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project (client only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project (client only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/bids:
    get:
      operationId: getProjectBids
      tags: [projects]
      summary: List bids on a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bids list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BidWithFreelancer"
    post:
      operationId: submitBid
      tags: [projects]
      summary: Submit a bid on a project (freelancer only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidInput"
      responses:
        "201":
          description: Bid submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"

  /bids/{id}:
    patch:
      operationId: updateBid
      tags: [projects]
      summary: Accept or reject a bid (client only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidPatch"
      responses:
        "200":
          description: Updated bid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [freelancer, client]
        phone:
          type: string

    AuthUser:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, trainer, student, freelancer, client]

    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, trainer, student, freelancer, client]
        phone:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, trainer, student, freelancer, client]
        phone:
          type: string

    UserPatch:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, trainer, student, freelancer, client]
        phone:
          type: ["string", "null"]

    Course:
      type: object
      required: [id, title, description, category, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        duration:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        trainerId:
          type: ["integer", "null"]
        trainerName:
          type: ["string", "null"]
        createdAt:
          type: string

    CourseInput:
      type: object
      required: [title, description, category]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        duration:
          type: string
        status:
          type: string
          enum: [active, inactive]
        trainerId:
          type: integer

    CoursePatch:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        duration:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        trainerId:
          type: ["integer", "null"]

    Enrollment:
      type: object
      required: [id, userId, courseId, enrolledAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        courseId:
          type: integer
        enrolledAt:
          type: string

    EnrollmentInput:
      type: object
      required: [userId, courseId]
      properties:
        userId:
          type: integer
        courseId:
          type: integer

    EnrollmentWithCourse:
      type: object
      required: [id, userId, courseId, enrolledAt, course]
      properties:
        id:
          type: integer
        userId:
          type: integer
        courseId:
          type: integer
        enrolledAt:
          type: string
        course:
          $ref: "#/components/schemas/Course"

    Enquiry:
      type: object
      required: [id, fullName, email, phone, whatsapp, course, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        course:
          type: string
        status:
          type: string
          enum: [new, contacted, enrolled]
        createdAt:
          type: string

    EnquiryInput:
      type: object
      required: [fullName, email, phone, whatsapp, course]
      properties:
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        course:
          type: string

    EnquiryResult:
      type: object
      required: [id, whatsappUrl]
      properties:
        id:
          type: integer
        whatsappUrl:
          type: string

    LiveClass:
      type: object
      required: [id, title, roomName, scheduledAt, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        roomName:
          type: string
        scheduledAt:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string

    LiveClassInput:
      type: object
      required: [title, roomName, scheduledAt]
      properties:
        title:
          type: string
        roomName:
          type: string
        scheduledAt:
          type: string
        description:
          type: string

    DashboardStats:
      type: object
      required: [totalStudents, totalTrainers, totalCourses, totalEnrollments, totalEnquiries, newEnquiries]
      properties:
        totalStudents:
          type: integer
        totalTrainers:
          type: integer
        totalCourses:
          type: integer
        totalEnrollments:
          type: integer
        totalEnquiries:
          type: integer
        newEnquiries:
          type: integer

    # ── Freelancer Marketplace Schemas ────────────────────────────────────────

    FreelancerProfile:
      type: object
      required: [id, userId]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: ["string", "null"]
        hourlyRate:
          type: ["number", "null"]
        location:
          type: ["string", "null"]
        portfolioUrl:
          type: ["string", "null"]
        availability:
          type: string
          enum: [available, busy, unavailable]

    FreelancerProfileInput:
      type: object
      properties:
        title:
          type: string
        bio:
          type: string
        skills:
          type: string
        hourlyRate:
          type: number
        location:
          type: string
        portfolioUrl:
          type: string
        availability:
          type: string
          enum: [available, busy, unavailable]

    FreelancerPublic:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        title:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: ["string", "null"]
        hourlyRate:
          type: ["number", "null"]
        location:
          type: ["string", "null"]
        availability:
          type: ["string", "null"]

    BankDetails:
      type: object
      required: [id, userId, accountHolder, accountNumber, ifscCode, bankName]
      properties:
        id:
          type: integer
        userId:
          type: integer
        accountHolder:
          type: string
        accountNumber:
          type: string
        ifscCode:
          type: string
        bankName:
          type: string
        branch:
          type: ["string", "null"]
        upiId:
          type: ["string", "null"]

    BankDetailsInput:
      type: object
      required: [accountHolder, accountNumber, ifscCode, bankName]
      properties:
        accountHolder:
          type: string
        accountNumber:
          type: string
        ifscCode:
          type: string
        bankName:
          type: string
        branch:
          type: string
        upiId:
          type: string

    Project:
      type: object
      required: [id, clientId, title, description, category, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: string
        category:
          type: string
        skillsRequired:
          type: ["string", "null"]
        budgetMin:
          type: ["number", "null"]
        budgetMax:
          type: ["number", "null"]
        deadline:
          type: ["string", "null"]
        status:
          type: string
